name: "build"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2

jobs:
  publish-extensions:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.16.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build extensions and manifest
        env:
          EXTENSION_SIGNING_KEY: ${{ secrets.EXTENSION_SIGNING_KEY }}
        run: |
          SIGN_FLAG=""
          if [ -n "$EXTENSION_SIGNING_KEY" ]; then
            printf '%s\n' "$EXTENSION_SIGNING_KEY" > signing_key.asc
            SIGN_FLAG="--@extensions_sdk//:signing_key=//:signing_key.asc"
          fi
          bazel build $SIGN_FLAG //:all //:manifest
          rm -f signing_key.asc
          mkdir -p dist
          python3 - <<'PYEOF'
          import glob, os, shutil, zipfile, re

          os.makedirs("dist", exist_ok=True)
          for path in glob.glob("bazel-bin/*/*.msxt", recursive=False):
              with zipfile.ZipFile(path, "r") as zf:
                  pkg_name = None
                  if "manifest.pb" in zf.namelist():
                      # Parse package_name (field 1, length-delimited string) from ExtensionManifest
                      data = zf.read("manifest.pb")
                      if len(data) >= 2 and data[0] == 0x0A:
                          length = data[1]
                          if length < 128 and len(data) >= 2 + length:
                              pkg_name = data[2:2 + length].decode("utf-8", errors="ignore")
                  out_name = f"{pkg_name}.msxt" if pkg_name else os.path.basename(path)
                  shutil.copy2(path, os.path.join("dist", out_name))
                  print(f"Prepared {out_name} from {path}")
          PYEOF
          cp -f bazel-bin/manifest.pb dist/
          ls -1 dist/*.msxt dist/manifest.pb

      - name: Create Release
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs').promises;

            const { repo: { owner, repo }, sha } = context;
            console.log({ owner, repo, sha });

            const release = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: `release-${sha}`,
              name: `Extensions release (${new Date().toISOString().slice(0, 10)})`,
              draft: false,
              target_commitish: sha
            });

            console.log('created release', { release_id: release.data.id });

            for (const file of await fs.readdir('./dist')) {
              if (file.endsWith('.msxt') || file.endsWith('.pb')) {
                console.log('uploading', file);

                await github.rest.repos.uploadReleaseAsset({
                  owner, repo,
                  release_id: release.data.id,
                  name: file,
                  data: await fs.readFile(`./dist/${file}`)
                });
              }
            }
