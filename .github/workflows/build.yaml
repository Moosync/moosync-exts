name: "build"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2

jobs:
  publish-extensions:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-latest"

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install dependencies (ubuntu only)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: make curl

      - name: Install extism-js
        run: |
          curl -O https://raw.githubusercontent.com/extism/js-pdk/main/install.sh
          bash install.sh
          ldd --version

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: "wasm32-unknown-unknown,wasm32-wasip1"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24.0"

      - name: install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: Build extensions and manifest
        run: |
          bazel build //:all //:manifest
          mkdir -p dist
          find bazel-bin -name "*.msxt" -exec cp -f {} dist/ \;
          cp -f bazel-bin/manifest.pb dist/

      - name: Get release name
        id: date
        run: |
          echo "{release_name}={Extensions release ($(date +'%Y-%m-%d'))}" >> $GITHUB_STATE

      - name: Create Release
        uses: actions/github-script@v2
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            console.log('environment', process.versions);

            const fs = require('fs').promises;

            const { repo: { owner, repo }, sha } = context;
            console.log({ owner, repo, sha });

            const release = await github.repos.createRelease({
              owner, repo,
              tag_name: `release-${sha}`,
              draft: false,
              target_commitish: sha
            });

            console.log('created release', { release });

            for (let file of await fs.readdir('./dist')) {
              if (file.endsWith('.msxt') || file.endsWith('.pb')) {
                console.log('uploading', file);

                await github.repos.uploadReleaseAsset({
                  owner, repo,
                  release_id: release.data.id,
                  name: file,
                  data: await fs.readFile(`./dist/${file}`)
                });
              }
            }
