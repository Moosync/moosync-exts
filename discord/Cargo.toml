[package]
name = "moosync-discord-rpc"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.9.0"
getrandom = "0.2.15"
moosync-edk = { git = "https://github.com/Moosync/wasm-extension-runner.git" }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 's'
