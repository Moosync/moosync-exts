[package]
name = "moosync-discord-rpc"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.0"
getrandom = "0.2.16"
moosync-edk = { git = "https://github.com/Moosync/extensions-sdk.git" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 's'
