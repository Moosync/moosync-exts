[package]
name = "cover_art"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.31"
reqwest = { version = "0.12", features = ["cookies", "json"] }
serde = "1.0.228"
serde_json = "1.0.148"
url = "2.5.7"
urlencoding = "2.1.3"
tracing = "0.1"

[patch.crates-io]
reqwest = { git = "https://github.com/Ovenoboyo/reqwest_extism", branch = "0.12.x" }

[lib]
crate-type = ["cdylib"]
path = "src/main.rs"
