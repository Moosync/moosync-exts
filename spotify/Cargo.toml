[package]
name = "spotify"
version = "0.1.0"
edition = "2024"

[dependencies]

oauth2 = "5.0.0"
rspotify = "0.15.3"
serde = "1.0.228"
serde_json = "1.0.148"
reqwest = { version = "0.12.1", features = ["cookies"] }
chrono = "0.4.42"
url = "2.5.7"
futures = "0.3.31"
regex = "1.12.2"

[patch.crates-io]
reqwest = { git = "https://github.com/Ovenoboyo/reqwest_extism", branch = "0.12.x" }


[lib]
crate-type = ["cdylib"]
path = "src/main.rs"
